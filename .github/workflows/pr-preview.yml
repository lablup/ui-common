# Build the per-PR Storybook preview, publish it to gh-pages, and post the PR
# Analysis Report: the preview link, a deep link for each changed component's
# stories, and the bundle-size delta. Modeled on backend.ai-webui's PR Preview.
#
# The `paths` filter decides whether a PR gets a preview. GitHub matches it
# against the PR's own diff from the merge base, so no job re-asks.
#
# WHY THE DEPLOY LIVES HERE. A separate `workflow_run` deploy would run main's
# code with main's token, but a push by Copilot coding agent holds every run it
# causes for approval, and the `workflow_run` run that follows is held again —
# invisibly, because such runs are attached to main and never listed on the PR.
# Approval is per run, so the only way one approval can cover the deploy is for
# the deploy to be part of the approved run.
#
# SECURITY, the trade-off that buys it. `publish` and `report` are the only jobs
# with a write token, and they run from the PR's own copy of this file and of
# `.github/scripts/pr-preview`. Approving a Copilot run is therefore a review of
# the whole diff, not just a click to start the build. Keep both jobs free of
# anything that executes PR-authored source: they download the artifacts the
# build job produced and copy them as static files. Do not add a build step, a
# `pnpm install`, or any `run:` that invokes package scripts to either.
#
# Fork PRs get a read-only token no matter what this file declares, so
# `publish` and `report` skip them and a fork PR gets no preview.
#
# Needs GitHub Pages enabled for the `gh-pages` branch (Settings → Pages).
# Until then the deploy still pushes the branch and the report still posts; the
# links resolve once Pages is switched on.

name: PR Preview

on:
  pull_request:
    paths:
      - src/**
      - .storybook/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/build-defines.mjs
      - .github/workflows/pr-preview.yml
      - .github/scripts/pr-preview/**

permissions:
  contents: read

concurrency:
  # Keyed by PR number, not branch name: branch names are unique only within a
  # repository, so two fork PRs both using e.g. `patch-1` would share a group
  # and cancel each other's runs.
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Enough history for a three-dot diff against the base in the common
          # case; analyze-pr.mjs deepens on its own when the base has moved past
          # this window.
          fetch-depth: 50

      - name: Fetch base branch
        run: git fetch --depth=50 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Analyze changed components
        run: |
          node .github/scripts/pr-preview/analyze-pr.mjs \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --storybook-index storybook-static/index.json \
            --output analysis.json

      - name: Build and measure the package bundle (head)
        run: |
          pnpm run build
          node .github/scripts/pr-preview/measure-dist.mjs \
            --dist dist \
            --output bundle-head.json

      # Rebuild the package from the base's sources to get a comparable number.
      # Only `src/` is swapped, so node_modules stays put — which is also why
      # the delta is abandoned outright when the PR touches anything else that
      # feeds the build. Swapping only `src/` under a changed vite config or a
      # changed dependency set would build the "base" with the HEAD's bundling,
      # and report a delta (often a reassuring zero) that describes no real
      # comparison. Runs LAST, and best-effort: a failure costs the delta
      # column and nothing else.
      - name: Build and measure the package bundle (base)
        id: bundle-base
        continue-on-error: true
        run: |
          BUILD_INPUTS=(
            pnpm-lock.yaml
            pnpm-workspace.yaml
            package.json
            vite.config.ts
            tsconfig.json
            scripts/layer-order.mjs
            scripts/build-defines.mjs
          )
          if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- "${BUILD_INPUTS[@]}"; then
            echo "A build input outside src/ changed — skipping the base build (not comparable)."
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- "${BUILD_INPUTS[@]}"
            exit 0
          fi
          rm -rf src dist
          git checkout "origin/${{ github.base_ref }}" -- src
          pnpm run build
          node .github/scripts/pr-preview/measure-dist.mjs \
            --dist dist \
            --output bundle-base.json

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-storybook
          path: storybook-static/
          if-no-files-found: error
          retention-days: 7

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-preview-analysis
          path: |
            analysis.json
            bundle-head.json
            bundle-base.json
          if-no-files-found: error
          retention-days: 7

  # ── the write half ─────────────────────────────────────────────────────────
  # `publish` and `report` hold the only write tokens in this workflow, one
  # scope each, and they are independent so a gh-pages failure still leaves a
  # report and vice versa. Read the SECURITY note in the header before adding a
  # step to either: neither may execute PR-authored source.

  publish:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No shared concurrency group here: GitHub keeps one pending job per group
    # and cancels the older one, so a burst of PRs would lose previews. The
    # push retry below is what serializes gh-pages.
    steps:
      - name: Check out the maintenance scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/pr-preview

      - name: Download Storybook artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-preview-storybook
          path: storybook-dist

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A manual push with retry-on-conflict rather than a Pages action, so
          # a concurrent cleanup or sibling preview just retries instead of
          # failing the run.
          set -euo pipefail
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          WORK_DIR="$PWD"
          PAGES_DIR="${RUNNER_TEMP}/gh-pages"
          MAX_ATTEMPTS=8

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "::group::Attempt ${attempt} of ${MAX_ATTEMPTS}"
            cd "$WORK_DIR"
            rm -rf "$PAGES_DIR"

            if git clone --depth=1 --single-branch --branch gh-pages "$REPO_URL" "$PAGES_DIR" 2>/dev/null; then
              :
            else
              # First ever deploy: start the branch with no history to inherit.
              echo "No gh-pages branch — creating it."
              git init "$PAGES_DIR"
              git -C "$PAGES_DIR" checkout -b gh-pages
              git -C "$PAGES_DIR" remote add origin "$REPO_URL"
            fi

            rm -rf "${PAGES_DIR}/pr/${PR_NUMBER}"
            mkdir -p "${PAGES_DIR}/pr/${PR_NUMBER}/storybook"
            cp -r storybook-dist/. "${PAGES_DIR}/pr/${PR_NUMBER}/storybook/"
            # Tell Pages not to run the content through Jekyll, which would drop
            # Storybook's `_`-prefixed asset directories.
            touch "${PAGES_DIR}/.nojekyll"
            node .github/scripts/pr-preview/write-index.mjs --root "$PAGES_DIR"

            cd "$PAGES_DIR"
            git add -A
            git commit -m "Deploy PR #${PR_NUMBER} preview" \
              || { echo "Nothing to commit."; echo "::endgroup::"; exit 0; }

            if git push origin gh-pages; then
              echo "Deployed on attempt ${attempt}."
              echo "::endgroup::"
              exit 0
            fi

            delay=$((attempt + RANDOM % 5))
            echo "Push failed (likely a concurrent update); retrying in ${delay}s."
            echo "::endgroup::"
            sleep "$delay"
          done

          echo "::error::Failed to deploy the PR preview after ${MAX_ATTEMPTS} attempts."
          exit 1

  report:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # No setup-node — the report scripts use nothing beyond `node:fs` /
      # `node:child_process`, so the runner image's Node is enough.
      - name: Check out the report scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/pr-preview

      - name: Download analysis artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-preview-analysis
          path: pr-analysis

      - name: Post or update the PR Analysis Report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            // Everything the report needs that is not a measurement is derived
            // here, from the event payload, not from an artifact.
            fs.writeFileSync('pr-meta.json', JSON.stringify({
              prNumber: String(prNumber),
              shortHash: headSha.slice(0, 7),
              storybookUrl: `https://${owner}.github.io/${repo}/pr/${prNumber}/storybook/`,
              runUrl: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            }));

            const args = [
              '.github/scripts/pr-preview/generate-pr-comment.mjs',
              '--meta', 'pr-meta.json',
              '--analysis', 'pr-analysis/analysis.json',
            ];
            if (fs.existsSync('pr-analysis/bundle-head.json')) {
              args.push('--bundle-head', 'pr-analysis/bundle-head.json');
            }
            if (fs.existsSync('pr-analysis/bundle-base.json')) {
              args.push('--bundle-base', 'pr-analysis/bundle-base.json');
            }

            const body = execFileSync('node', args, { encoding: 'utf8' });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('PR Analysis Report'),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated the PR Analysis Report on #${prNumber}.`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              core.info(`Posted the PR Analysis Report on #${prNumber}.`);
            }
