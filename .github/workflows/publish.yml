name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [both, npmjs, github-packages]
        default: both
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

# Least privilege, declared per job rather than here, because the two
# registries need different things: GitHub Packages needs packages: write,
# npmjs needs id-token: write for provenance and neither needs the other's.
permissions:
  contents: read

jobs:
  # Decided once, before either registry publishes: two jobs each reading
  # main could disagree if main moved to a new line between them.
  # main's line publishes a prerelease under `next` and a plain version
  # under `latest`; an older line, released from its release/<line>
  # branch, under `release-<line>` only (scripts/dist-tag.mjs). 0.1's
  # alphas before the release/0.1 branch went out under `alpha`; that tag
  # is no longer moved. The registry still sets `latest` on a package's
  # first publish, so @lablup/ui-common-cli's `latest` is its first alpha
  # until 0.2.0; the docs say `@next` until then. Do not move `latest` here.
  dist-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Choose the dist-tag from the version
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git fetch --no-tags --depth=1 origin main
          MAIN_VERSION=$(git show FETCH_HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          TAG=$(node scripts/dist-tag.mjs "$VERSION" "$MAIN_VERSION")
          echo "Publishing $VERSION under dist-tag $TAG (main is at $MAIN_VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Consumed by internal projects that already authenticate to GitHub.
  github-packages:
    if: >-
      github.event_name == 'release' ||
      inputs.target == 'both' || inputs.target == 'github-packages'
    runs-on: ubuntu-latest
    needs: dist-tag
    environment: release
    permissions:
      contents: read
      packages: write
    # setup-node writes an .npmrc containing ${NODE_AUTH_TOKEN}, and pnpm warns
    # on every step where that variable is unset. Defining it empty here silences
    # the warning without handing a publish-capable credential to install, build
    # and test steps, which run third-party code from node_modules. The real
    # secret is attached only to the steps that actually talk to the registry.
    env:
      NODE_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@lablup"

      - run: pnpm install --frozen-lockfile

      - name: Verify before publishing
        run: pnpm run verify

      # @lablup/ui-common (the root) and @lablup/ui-common-cli (packages/cli)
      # are released together at one version: the CLI takes the library as an
      # exact peer.
      - name: Confirm both packages are at one version
        run: |
          LIB=$(node -p "require('./package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          if [ "$LIB" != "$CLI" ]; then
            echo "@lablup/ui-common is $LIB but @lablup/ui-common-cli is $CLI" >&2
            exit 1
          fi

      - name: Confirm the release tag matches the package versions
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for PKG in package.json packages/cli/package.json; do
            PKG_VERSION=$(node -p "require('./$PKG').version")
            if [ "$PKG_VERSION" != "$TAG" ]; then
              echo "$PKG is $PKG_VERSION but the release tag is $TAG" >&2
              exit 1
            fi
          done

      # pnpm packs both, rewriting the CLI's `workspace:*` peer to the exact
      # version; the library goes first so the CLI's peer exists when it lands.
      - name: Pack both packages
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          pnpm pack --pack-destination "$RUNNER_TEMP/packed"
          pnpm --filter @lablup/ui-common-cli pack --pack-destination "$RUNNER_TEMP/packed"
          ls -la "$RUNNER_TEMP/packed"

      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        run: |
          for PKG in lablup-ui-common lablup-ui-common-cli; do
            npm publish "$RUNNER_TEMP/packed/$PKG-${{ needs.dist-tag.outputs.version }}.tgz" --access public --tag ${{ needs.dist-tag.outputs.tag }} --registry https://npm.pkg.github.com
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          for PKG in lablup-ui-common lablup-ui-common-cli; do
            npm publish "$RUNNER_TEMP/packed/$PKG-${{ needs.dist-tag.outputs.version }}.tgz" --dry-run --access public --tag ${{ needs.dist-tag.outputs.tag }} --registry https://npm.pkg.github.com
          done

  # GitHub Packages requires authentication even for public packages, so an
  # open-source consumer cannot install from it without every contributor
  # minting a token. npmjs is the registry that makes this package actually
  # public, which is the point of publishing it publicly at all.
  npmjs:
    if: >-
      github.event_name == 'release' ||
      inputs.target == 'both' || inputs.target == 'npmjs'
    runs-on: ubuntu-latest
    needs: dist-tag
    environment: release
    permissions:
      contents: read
      # Provenance: npm records which repository, workflow and commit produced
      # the tarball, and shows a verified badge on the package page. It costs
      # one permission and is worth it for a package strangers install.
      id-token: write
    # setup-node writes an .npmrc containing ${NODE_AUTH_TOKEN}, and pnpm warns
    # on every step where that variable is unset. Defining it empty here silences
    # the warning without handing a publish-capable credential to install, build
    # and test steps, which run third-party code from node_modules. The real
    # secret is attached only to the steps that actually talk to the registry.
    env:
      NODE_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@lablup"

      - run: pnpm install --frozen-lockfile

      - name: Verify before publishing
        run: pnpm run verify

      # @lablup/ui-common (the root) and @lablup/ui-common-cli (packages/cli)
      # are released together at one version: the CLI takes the library as an
      # exact peer.
      - name: Confirm both packages are at one version
        run: |
          LIB=$(node -p "require('./package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          if [ "$LIB" != "$CLI" ]; then
            echo "@lablup/ui-common is $LIB but @lablup/ui-common-cli is $CLI" >&2
            exit 1
          fi

      - name: Confirm the release tag matches the package versions
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for PKG in package.json packages/cli/package.json; do
            PKG_VERSION=$(node -p "require('./$PKG').version")
            if [ "$PKG_VERSION" != "$TAG" ]; then
              echo "$PKG is $PKG_VERSION but the release tag is $TAG" >&2
              exit 1
            fi
          done

      # pnpm packs both, rewriting the CLI's `workspace:*` peer to the exact
      # version; the library goes first so the CLI's peer exists when it lands.
      - name: Pack both packages
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          pnpm pack --pack-destination "$RUNNER_TEMP/packed"
          pnpm --filter @lablup/ui-common-cli pack --pack-destination "$RUNNER_TEMP/packed"
          ls -la "$RUNNER_TEMP/packed"

      - name: Confirm the credential is valid for npmjs
        run: npm whoami --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm publishes the tarballs pnpm packed: provenance is an npm CLI
      # feature, and npm would leave the CLI's `workspace:*` peer unrewritten
      # if it packed the directory itself.
      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        run: |
          for PKG in lablup-ui-common lablup-ui-common-cli; do
            npm publish "$RUNNER_TEMP/packed/$PKG-${{ needs.dist-tag.outputs.version }}.tgz" --provenance --access public --tag ${{ needs.dist-tag.outputs.tag }} --registry https://registry.npmjs.org
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          for PKG in lablup-ui-common lablup-ui-common-cli; do
            npm publish "$RUNNER_TEMP/packed/$PKG-${{ needs.dist-tag.outputs.version }}.tgz" --dry-run --access public --tag ${{ needs.dist-tag.outputs.tag }} --registry https://registry.npmjs.org
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
