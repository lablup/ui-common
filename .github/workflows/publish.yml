name: Publish

on:
  release:
    types: [published]
  # Every merge to main publishes a canary under the `canary` dist-tag
  # (scripts/canary-version.mjs), as backend.ai-ui does in the webui
  # repository. Changes that ship nothing do not.
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - ".claude/**"
      - ".storybook/**"
      - "docs/**"
      - "fixture/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "**/*.stories.tsx"
  # A PR from a branch of this repository publishes a preview under
  # `pr-<number>`, so a consumer PR (webui) can pin and verify the change
  # before it merges. Fork PRs get no secrets and are skipped.
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - ".github/**"
      - ".claude/**"
      - ".storybook/**"
      - "docs/**"
      - "fixture/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "**/*.stories.tsx"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [both, npmjs, github-packages]
        default: both
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: true

# Least privilege, declared per job: the build job has no credential at all,
# GitHub Packages needs packages: write, npmjs needs id-token: write for
# provenance, and neither registry job needs the other's.
permissions:
  contents: read

# Canaries queue so `canary` cannot land on an older merge after a newer one;
# a queued canary that a newer merge supersedes is dropped. A PR's newer push
# cancels its running preview. Releases and manual runs each get their own group.
concurrency:
  group: >-
    publish-${{ github.event_name == 'push' && 'canary' ||
    github.event_name == 'pull_request' &&
    format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that runs repository code — install, verify, build, pack — runs
  # here, with no secret, no environment and no id-token: a PR preview runs
  # unreviewed code, and anything that shares a runner with a step holding
  # NPM_TOKEN can read it. The registry jobs below only download the tarballs.
  #
  # The dist-tag is decided once, before either registry publishes. main's
  # line publishes a prerelease under `next` and a plain version under
  # `latest`; an older line, released from its release/<line> branch, under
  # `release-<line>` only (scripts/dist-tag.mjs). 0.1's alphas before the
  # release/0.1 branch went out under `alpha`; that tag is no longer moved.
  # The registry still sets `latest` on a package's first publish, so
  # @lablup/ui-common-cli's `latest` is its first alpha until 0.2.0; the docs
  # say `@next` until then. Do not move `latest` here. A push to main
  # publishes a canary instead, and a PR a preview: a version derived from the
  # package's and the commit, under `canary` or `pr-<number>`, with nothing
  # committed.
  build:
    # Dependabot PRs get Dependabot's secrets, which hold no NPM_TOKEN.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A PR publishes its head commit, not the merge with main.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Choose the dist-tag from the version
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$EVENT" = "push" ] || [ "$EVENT" = "pull_request" ]; then
            if [ "$EVENT" = "push" ]; then
              # A rerun of an older merge must not move `canary` back.
              git fetch --no-tags --depth=1 origin main
              if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
                echo "main has moved past $GITHUB_SHA; its canary publishes instead."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            CHANNEL=canary
            [ "$EVENT" = "pull_request" ] && CHANNEL="pr-$PR_NUMBER"
            SHA=$(git rev-parse HEAD)
            STAMP=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S)
            CANARY=$(node scripts/canary-version.mjs "$VERSION" "$STAMP" "$SHA" "$CHANNEL")
            echo "Publishing $CANARY under dist-tag $CHANNEL (package.json is at $VERSION)"
            echo "tag=$CHANNEL" >> "$GITHUB_OUTPUT"
            echo "version=$CANARY" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin main
          MAIN_VERSION=$(git show FETCH_HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          TAG=$(node scripts/dist-tag.mjs "$VERSION" "$MAIN_VERSION")
          echo "Publishing $VERSION under dist-tag $TAG (main is at $MAIN_VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - if: steps.tag.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify before publishing
        if: steps.tag.outputs.skip != 'true'
        run: pnpm run verify

      # @lablup/ui-common (the root) and @lablup/ui-common-cli (packages/cli)
      # are released together at one version: the CLI takes the library as an
      # exact peer.
      - name: Confirm both packages are at one version
        if: steps.tag.outputs.skip != 'true'
        run: |
          LIB=$(node -p "require('./package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          if [ "$LIB" != "$CLI" ]; then
            echo "@lablup/ui-common is $LIB but @lablup/ui-common-cli is $CLI" >&2
            exit 1
          fi

      - name: Confirm the release tag matches the package versions
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for PKG in package.json packages/cli/package.json; do
            PKG_VERSION=$(node -p "require('./$PKG').version")
            if [ "$PKG_VERSION" != "$TAG" ]; then
              echo "$PKG is $PKG_VERSION but the release tag is $TAG" >&2
              exit 1
            fi
          done

      # After verify, so the checks run on the files as committed. The build
      # inlines the package version (scripts/build-defines.mjs), so it reruns.
      - name: Set the canary version
        if: >-
          steps.tag.outputs.skip != 'true' &&
          (github.event_name == 'push' || github.event_name == 'pull_request')
        run: |
          npm pkg set version="$VERSION"
          npm pkg set version="$VERSION" --prefix packages/cli
          pnpm run build
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      # pnpm packs both, rewriting the CLI's `workspace:*` peer to the exact
      # version; the library goes first so the CLI's peer exists when it lands.
      - name: Pack both packages
        if: steps.tag.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          pnpm pack --pack-destination "$RUNNER_TEMP/packed"
          pnpm --filter @lablup/ui-common-cli pack --pack-destination "$RUNNER_TEMP/packed"
          ls -la "$RUNNER_TEMP/packed"

      - if: steps.tag.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: packed
          path: ${{ runner.temp }}/packed/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Consumed by internal projects that already authenticate to GitHub.
  # Checks nothing out and installs nothing: it publishes what `build` packed.
  github-packages:
    if: >-
      needs.build.outputs.skip != 'true' &&
      (github.event_name == 'release' || github.event_name == 'push' ||
      inputs.target == 'both' || inputs.target == 'github-packages')
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: "@lablup"

      - uses: actions/download-artifact@v8
        with:
          name: packed
          path: packed

      # A version that is already there (a rerun after a partial publish) only
      # gets its dist-tag moved: npm versions are immutable.
      - name: Publish
        if: >-
          github.event_name == 'release' || github.event_name == 'push' ||
          inputs.dry_run == false
        run: |
          for NAME in ui-common ui-common-cli; do
            if npm view "@lablup/$NAME@$VERSION" version --registry "$REGISTRY" > /dev/null 2>&1; then
              npm dist-tag add "@lablup/$NAME@$VERSION" "$TAG" --registry "$REGISTRY"
            else
              npm publish "packed/lablup-$NAME-$VERSION.tgz" --access public --tag "$TAG" --registry "$REGISTRY"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY: https://npm.pkg.github.com
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          for NAME in ui-common ui-common-cli; do
            npm publish "packed/lablup-$NAME-$VERSION.tgz" --dry-run --access public --tag "$TAG" --registry https://npm.pkg.github.com
          done
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}

  # GitHub Packages requires authentication even for public packages, so an
  # open-source consumer cannot install from it without every contributor
  # minting a token. npmjs is the registry that makes this package actually
  # public, which is the point of publishing it publicly at all.
  npmjs:
    if: >-
      needs.build.outputs.skip != 'true' &&
      (github.event_name == 'release' || github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      inputs.target == 'both' || inputs.target == 'npmjs')
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      contents: read
      # Provenance: npm records which repository, workflow and commit produced
      # the tarball, and shows a verified badge on the package page. It costs
      # one permission and is worth it for a package strangers install.
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          scope: "@lablup"

      - uses: actions/download-artifact@v8
        with:
          name: packed
          path: packed

      - name: Confirm the credential is valid for npmjs
        run: npm whoami --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm publishes the tarballs pnpm packed: provenance is an npm CLI
      # feature, and npm would leave the CLI's `workspace:*` peer unrewritten
      # if it packed the directory itself. A version that is already there only
      # gets its dist-tag moved.
      - name: Publish
        if: >-
          github.event_name == 'release' || github.event_name == 'push' ||
          github.event_name == 'pull_request' || inputs.dry_run == false
        run: |
          for NAME in ui-common ui-common-cli; do
            if npm view "@lablup/$NAME@$VERSION" version --registry "$REGISTRY" > /dev/null 2>&1; then
              npm dist-tag add "@lablup/$NAME@$VERSION" "$TAG" --registry "$REGISTRY"
            else
              npm publish "packed/lablup-$NAME-$VERSION.tgz" --provenance --access public --tag "$TAG" --registry "$REGISTRY"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REGISTRY: https://registry.npmjs.org
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          for NAME in ui-common ui-common-cli; do
            npm publish "packed/lablup-$NAME-$VERSION.tgz" --dry-run --access public --tag "$TAG" --registry https://registry.npmjs.org
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}

  # One comment per PR, updated on every push: the exact preview version and
  # the command a consumer runs to pin it. Agents read the version from here.
  preview-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [build, npmjs]
    permissions:
      pull-requests: write
    steps:
      - name: Upsert the preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          MARKER="<!-- ui-common-preview -->"
          BODY=$(cat <<EOF
          $MARKER
          **Preview published** under the \`$TAG\` dist-tag (npmjs): \`$VERSION\`

          \`\`\`sh
          pnpm add @lablup/ui-common@$VERSION
          pnpm add -D @lablup/ui-common-cli@$VERSION
          \`\`\`

          In backend.ai-webui: \`pnpm run ui-common:pin $TAG\`. A consumer PR pinned to a preview cannot merge; repin to \`canary\` after this PR merges.
          EOF
          )
          ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$BODY" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" > /dev/null
          fi
