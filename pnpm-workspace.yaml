# Settings for this repository's own dev install. They do not travel with the
# published package; consumers resolve @lablup/ui-common's dependencies under
# their own pnpm settings.

# The library is the repository root; its CLI is packages/cli
# (@lablup/ui-common-cli), published separately at the same version.
packages:
  - "."
  - "packages/*"

# @astryxdesign/lab is a canary build. Canary releases never age out of a
# release-age quarantine by design, so it is excluded for as long as the exact
# pin exists (the same exclusion backend.ai-webui carries).
minimumReleaseAgeExclude:
  - "@astryxdesign/lab@0.7.0-canary.97a0d31"
  # Astryx 0.7.0 was published the day this pin moved, inside pnpm's default
  # release-age window. Drop these once it has aged out.
  - "@astryxdesign/cli@0.7.0"
  - "@astryxdesign/core@0.7.0"
  - "@astryxdesign/theme-neutral@0.7.0"

peerDependencyRules:
  # The lab canary declares an exact peer on the core canary it was cut from
  # (`@astryxdesign/core@0.7.0-canary.97a0d31`). It runs against the stable
  # 0.7.0 that ui-common pins, which is how backend.ai-webui installs it too.
  # This only silences the mismatch warning in this repository's dev install.
  allowedVersions:
    "@astryxdesign/lab>@astryxdesign/core": "0.7.0"

allowBuilds:
  # Each postinstall only prints an `astryx init` nudge; no build output is
  # needed. Listing them keeps pnpm from failing with ERR_PNPM_IGNORED_BUILDS.
  "@astryxdesign/cli": false
  "@astryxdesign/core": false
  # sass's optional native file watcher; the tests compile, they never watch.
  "@parcel/watcher": false
  # Storybook's bundler. Its postinstall only checks that the platform binary
  # from its optional dependency is in place; the binary works without it.
  esbuild: false
