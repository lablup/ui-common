# The fixture is a consumer, so it is its own pnpm workspace rather than a
# package of this repository's, and installs under a consumer's settings.
#
# This is the block a pnpm 11 consumer of @lablup/ui-common needs: Astryx's
# packages have a postinstall that only prints an `astryx init` nudge, and
# pnpm refuses to install (ERR_PNPM_IGNORED_BUILDS) until each one is either
# allowed or declined. Nothing needs to run, so both are declined.
# Astryx 0.7.3, which @lablup/ui-common pins, was published the day before
# the pin moved, inside pnpm's default release-age window. Drop these once it
# has aged out. (No ui-common template needs the @astryxdesign/lab canary any
# more: the Drawer is core's since Astryx 0.7.2.)
minimumReleaseAgeExclude:
  - "@astryxdesign/core@0.7.3"
  - "@astryxdesign/theme-neutral@0.7.3"
  - "@astryxdesign/cli@0.7.3"

allowBuilds:
  # A dependency of @lablup/ui-common.
  "@astryxdesign/core": false
  # A dependency of @lablup/ui-common-cli (the ui-common bin).
  "@astryxdesign/cli": false
